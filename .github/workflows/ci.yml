name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  validate:
    name: Repository invariants · ubuntu · node 24 · clean install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      # No setup-node cache here: this is the deliberately cold dependency path.
      - name: Install dependencies without a restored cache
        run: npm ci
      - name: Audit the production dependency graph
        run: npm run audit:production
      - name: Check generated stage skills
        run: npm run skills:check
      - name: Check generated artifact authoring schemas
        run: npm run authoring-schemas:check
      - name: Check generated role definitions
        run: npm run roles:check

  core:
    name: Core · ubuntu · node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:ci:core

  node-compat:
    name: Node compatibility · ubuntu · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci:node

  platform:
    name: Platform behavior · ${{ matrix.os }} · node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Check generation once per OS, not once per Node/OS product cell. That preserves the
      # line-ending and path-separator control without four identical executions.
      - name: Check generated stage skills on Windows
        if: matrix.os == 'windows-latest'
        run: npm run skills:check
      - name: Check generated artifact authoring schemas on Windows
        if: matrix.os == 'windows-latest'
        run: npm run authoring-schemas:check
      - name: Check generated role definitions on Windows
        if: matrix.os == 'windows-latest'
        run: npm run roles:check
      - name: Fetch Sysinternals handle for cleanup diagnostics
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://live.sysinternals.com/handle64.exe -OutFile "$env:RUNNER_TEMP\handle64.exe" -TimeoutSec 60
          "HANDLE_EXE=$env:RUNNER_TEMP\handle64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run test:ci:platform

  setup:
    name: Setup and recovery · ${{ matrix.os }} · node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:ci:setup

  consumer:
    name: Clean consumer · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "22"
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Fetch Sysinternals handle for cleanup diagnostics
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://live.sysinternals.com/handle64.exe -OutFile "$env:RUNNER_TEMP\handle64.exe" -TimeoutSec 60
          "HANDLE_EXE=$env:RUNNER_TEMP\handle64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run test:ci:consumer

  pi-compat-live:
    name: Live Pi compatibility · ubuntu · node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:pi-compat
        env:
          KILN_PI_COMPAT: live
