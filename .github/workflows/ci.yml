# F11 DIAGNOSTIC BRANCH ONLY. Never merged. The full suite, repeated on Windows, with ACC-0116's cleanup instrumented:
# on EBUSY it records handle owners, the process table and the time until the directory can be removed.
name: CI

on:
  push:

jobs:
  f11:
    name: windows · node ${{ matrix.node }} · f11 ${{ matrix.attempt }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Fetch Sysinternals handle
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://live.sysinternals.com/handle64.exe -OutFile "$env:RUNNER_TEMP\handle64.exe"
          "HANDLE_EXE=$env:RUNNER_TEMP\handle64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "F11_OUT=$env:GITHUB_WORKSPACE\f11-events.jsonl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run the test suite
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f11-node${{ matrix.node }}-${{ matrix.attempt }}
          path: f11-events.jsonl
          if-no-files-found: ignore
